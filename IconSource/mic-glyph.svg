<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Microphone glyph — foreground layer for Icon Composer.
       White on transparent so the tool can apply material / tint. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- yoke / cradle -->
    <path d="M 307 455 A 205 205 0 0 0 717 455" />
    <!-- stem -->
    <line x1="512" y1="660" x2="512" y2="752" />
    <!-- base -->
    <line x1="407" y1="778" x2="617" y2="778" />
  </g>
  <!-- capsule (mic head) -->
  <rect x="397" y="235" width="230" height="325" rx="115" fill="#FFFFFF" />
</svg>
