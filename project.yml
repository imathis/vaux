name: Vaux
options:
  bundleIdPrefix: dev.imathis
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Numbers only (macOS expects it). Bump the build each release.
    MARKETING_VERSION: "1.0.0"
    # The release's name: tag, zip, cask, and the version About shows.
    VAUX_RELEASE: "1.0.0-alpha.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: Q2573QH43F
    CODE_SIGN_STYLE: Automatic

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # 3.1.0+: earlier recorders can't record on macOS 26/27 (editing restarts
    # end recording immediately; the key monitor gets deallocated).
    from: "3.1.0"

targets:
  Vaux:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Shared
    dependencies:
      # Embedded in Contents/Library/SystemExtensions, installed only when
      # the camera is turned on.
      - target: VauxCamera
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.imathis.vaux
        PRODUCT_NAME: Vaux
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Mac App Store requires App Sandbox. Verified: HAL mute/volume read+write
        # works sandboxed WITHOUT the audio-input entitlement (no mic permission).
        # Media pause can't ship there: it uses private MediaRemote. Solo mode
        # (Accessibility presses in Slack/Discord) is untested sandboxed.
        # Uncomment to enable (e.g. for App Store builds):
        # CODE_SIGN_ENTITLEMENTS: Sources/Vaux.entitlements
        # Vaux Camera: installing the extension, and camera access. The
        # install entitlement needs a provisioning profile.
        CODE_SIGN_ENTITLEMENTS: Sources/VauxCamera.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Vaux
        COMBINE_HIDPI_IMAGES: YES
        VAUX_DISPLAY_NAME: Vaux
      configs:
        # Development builds are a separate app to macOS: permissions are
        # granted per bundle ID and signature, so sharing the release's ID
        # makes each build's grant knock out the other's. Own settings too.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.imathis.vaux.debug
          VAUX_DISPLAY_NAME: Vaux Dev

  # Vaux Camera: the camera extension. Sandboxed; its app group (no profile
  # needed) names its Mach service.
  VauxCamera:
    type: system-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CameraExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.imathis.vaux.camera
        # System extensions are named by their bundle ID.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        VAUX_APP_GROUP: Q2573QH43F.dev.imathis.vaux
        VAUX_CAMERA_NAME: Vaux Camera
        # macOS replaces an installed extension only when this changes; the
        # Makefile sets it from the extension's source (see there).
        VAUX_CAMERA_BUILD: "1"
        INFOPLIST_FILE: CameraExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Vaux Dev's own camera, beside the release's.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.imathis.vaux.debug.camera
          VAUX_APP_GROUP: Q2573QH43F.dev.imathis.vaux.debug
          VAUX_CAMERA_NAME: Vaux Dev Camera
